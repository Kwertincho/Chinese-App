<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HanziApp" />

    <title>Mandarin HSK Studio</title>
    <meta
      name="description"
      content="Interactive offline-ready Mandarin Chinese & HSK learning Progressive Web App featuring 3-stage Hanzi stroke calligraphy, native zh-CN speech synthesis, tone sandhi drills, and adaptive spaced repetition."
    />
    <meta property="og:title" content="Mandarin HSK Studio" />
    <meta
      property="og:description"
      content="Interactive offline-ready Mandarin Chinese & HSK learning Progressive Web App featuring 3-stage Hanzi stroke calligraphy, native zh-CN speech synthesis, tone sandhi drills, and adaptive spaced repetition."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"
      defer
    ></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-rose-500/30 selection:text-rose-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch(() => {
              // Ignore service worker registration errors in restricted preview frames
            });
        });
      }
    </script>
  </body>
</html>
